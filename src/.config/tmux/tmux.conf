# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 1-indexed panes/windows
set -g base-index 1
setw -g pane-base-index 1

# Split panes with | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse support
set -g mouse on

# Reduce escape delay (better for vim/nvim)
set -sg escape-time 10
